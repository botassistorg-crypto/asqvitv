*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0E21;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#1C1E2D;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{background:linear-gradient(135deg,#FF2D55,#FF6B35);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:20px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#FF2D55,#FF6B35);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.live-badge{background:#FF2D55;color:#fff;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.search-wrap{padding:12px 16px}
.search-input{width:100%;padding:12px 18px;background:#1C1E2D;border:1px solid rgba(255,255,255,.1);border-radius:25px;color:#fff;font-size:14px;outline:none;transition:border .3s}
.search-input:focus{border-color:#FF2D55}
.search-input::placeholder{color:rgba(255,255,255,.3)}
.cats{display:flex;gap:8px;padding:6px 16px 12px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-btn{padding:7px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:#1C1E2D;color:rgba(255,255,255,.55);cursor:pointer;white-space:nowrap;font-size:12px;transition:all .2s}
.cat-btn.active{background:linear-gradient(135deg,#FF2D55,#FF6B35);border:none;color:#fff;font-weight:700}
.status-bar{margin:0 16px 10px;padding:10px 14px;background:#1C1E2D;border-radius:12px;font-size:12px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#00ff88;flex-shrink:0}
.banner{margin:8px 16px;background:linear-gradient(135deg,#1a0a2e,#FF2D55 80%,#FF6B35);border-radius:18px;padding:20px;position:relative;overflow:hidden;cursor:pointer}
.banner::after{content:'⚽';position:absolute;right:-15px;bottom:-15px;font-size:110px;opacity:.12}
.banner-live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:15px;font-size:11px;font-weight:700;margin-bottom:8px}
.banner-title{font-size:22px;font-weight:900;margin-bottom:3px}
.banner-sub{font-size:13px;opacity:.8;margin-bottom:12px}
.banner-btn{background:#fff;color:#FF2D55;border:none;padding:8px 20px;border-radius:22px;font-weight:700;font-size:13px;cursor:pointer}
.section-title{padding:14px 16px 10px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.section-title small{color:rgba(255,255,255,.35);font-size:12px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px;padding:0 16px}
.card{background:#1C1E2D;border-radius:14px;padding:15px 10px;cursor:pointer;border:1px solid rgba(255,255,255,.05);transition:all .25s;text-align:center;position:relative;overflow:hidden}
.card:hover,.card:active{border-color:#FF2D55;transform:translateY(-3px);box-shadow:0 8px 25px rgba(255,45,85,.2)}
.card-logo{width:52px;height:52px;object-fit:contain;border-radius:10px;margin:0 auto 10px;display:block}
.card-placeholder{width:52px;height:52px;background:linear-gradient(135deg,#FF2D55,#FF6B35);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px}
.card-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:4px;line-height:1.3}
.card-cat{font-size:10px;color:rgba(255,255,255,.3)}
.live-tag{position:absolute;top:7px;right:7px;background:red;color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:5px}
.player-wrap{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column}
.player-wrap.show{display:flex}
.player-top{display:flex;align-items:center;gap:12px;padding:13px 16px;background:rgba(0,0,0,.85)}
.back-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn:hover{background:#FF2D55}
.player-name{flex:1;font-size:14px;font-weight:700}
.live-pill{background:rgba(255,0,0,.2);border:1px solid red;color:red;padding:4px 10px;border-radius:15px;font-size:10px;font-weight:700;white-space:nowrap}
.video-box{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
#mainVideo{width:100%;height:100%;max-height:calc(100vh - 65px)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:14px;text-align:center;padding:20px}
.overlay.hidden{display:none}
.spinner{width:40px;height:40px;border:3px solid rgba(255,45,85,.3);border-top:3px solid #FF2D55;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry-btn{background:#FF2D55;color:#fff;border:none;padding:10px 24px;border-radius:20px;cursor:pointer;font-size:14px;margin-top:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1C1E2D;display:flex;justify-content:space-around;padding:9px 0 13px;box-shadow:0 -4px 20px rgba(0,0,0,.4);z-index:98}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:rgba(255,255,255,.35);font-size:10px;padding:3px 14px}
.nav-item.active{color:#FF2D55}
.nav-icon{font-size:20px}
.main{padding-bottom:80px}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
</style>
</head>

<div class="main">

  <div class="cats" id="catBar">

    <button class="cat-btn" onclick="setCat('News')">📰 News</button>
    <button class="cat-btn" onclick="setCat('Entertainment')">🎬 Entertainment</button>
    <button class="cat-btn" onclick="setCat('Movies')">🎥 Movies</button>
    <button class="cat-btn" onclick="setCat('Music')">🎵 Music</button>
    <button class="cat-btn" onclick="setCat('Kids')">🧒 Kids</button>
    <button class="cat-btn" onclick="setCat('Religious')">🕌 Religious</button>
    <button class="cat-btn" onclick="setCat('International')">🌐 International</button>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="statusText">✅ 500+ channels loaded worldwide</span>
  </div>

  <div class="banner" onclick="setCat('Sports')">
    <div class="banner-live">● LIVE NOW</div>
    <div class="banner-title">⚽ LIVE SPORTS & FIFA</div>
    <div class="banner-sub" id="bannerSub">Tap to browse all sports channels</div>
    <button class="banner-btn">▶ WATCH NOW</button>
  </div>

  <div class="section-title">

    <small id="countLabel">500+ channels</small>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- PLAYER -->
<div class="player-wrap" id="playerWrap">
  <div class="player-top">
    <button class="back-btn" onclick="closePlayer()">←</button>
    <div class="player-name" id="playerName">Loading...</div>
    <div class="live-pill">● LIVE</div>
  </div>
  <div class="video-box">
    <video id="mainVideo" controls playsinline webkit-playsinline></video>
    <div class="overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p style="color:rgba(255,255,255,.6);font-size:13px">Connecting to stream...</p>
    </div>
    <div class="overlay hidden" id="errorOverlay">
      <div style="font-size:48px">📡</div>
      <p style="font-size:16px;font-weight:700">Stream Unavailable</p>
      <p style="font-size:12px;color:rgba(255,255,255,.5)">This channel may be offline.<br/>Try another channel.</p>
      <button class="retry-btn" onclick="retry()">🔄 Retry</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

</div>

// ═══════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════
let filtered = [...CHANNELS];
let currentCat = 'All';
let currentUrl = '';
let hls = null;
const video = document.getElementById('mainVideo');

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render() {
  let list = currentCat === 'All'
    ? CHANNELS
    : CHANNELS.filter(c =>
        c.c === currentCat ||
        c.n.toLowerCase().includes(currentCat.toLowerCase())
      );

  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (q) {
    list = list.filter(c =>
      c.n.toLowerCase().includes(q) ||
      c.c.toLowerCase().includes(q)
    );
  }

  filtered = list;
  document.getElementById('countLabel').textContent =
    list.length + ' channels';

  if (!list.length) {
    document.getElementById('grid').innerHTML =
      `<div style="grid-column:1/-1;text-align:center;
         padding:40px;color:rgba(255,255,255,.4)">
         No channels found
       </div>`;
    return;
  }

  document.getElementById('grid').innerHTML = list.map((ch, i) => `
    <div class="card" onclick="play(${i})">
      <div class="live-tag">LIVE</div>
      ${ch.l
        ? `<img class="card-logo" src="${ch.l}" loading="lazy"
             onerror="this.style.display='none';
             this.nextElementSibling.style.display='flex'"/>
           <div class="card-placeholder" style="display:none">📺</div>`
        : `<div class="card-placeholder">📺</div>`
      }
      <div class="card-name">${ch.n}</div>
      <div class="card-cat">${ch.c}</div>
    </div>
  `).join('');

  // Update sports banner
  const sCount = CHANNELS.filter(c=>c.c==='Sports').length;
  document.getElementById('bannerSub').textContent =
    `${sCount} live sports channels • Tap to browse`;
}

// ═══════════════════════════════════════
// CATEGORY
// ═══════════════════════════════════════
function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active',
      b.textContent.trim().includes(cat) ||
      (cat==='All' && b.textContent.includes('All'))
    );
  });
  render();
}

document.getElementById('searchInput').addEventListener('input', render);

// ═══════════════════════════════════════
// PLAYER
// ═══════════════════════════════════════
function play(i) {
  const ch = filtered[i];
  if (!ch) return;
  currentUrl = ch.u;
  document.getElementById('playerName').textContent = ch.n;
  document.getElementById('playerWrap').classList.add('show');
  document.getElementById('loadingOverlay').classList.remove('hidden');
  document.getElementById('errorOverlay').classList.add('hidden');
  video.style.display = 'block';
  startStream(ch.u);
}

function startStream(url) {
  if (hls) { hls.destroy(); hls = null; }
  video.src = '';

  const isHLS = /\.m3u8|\/hls\//i.test(url);

  if (isHLS && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, maxBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      document.getElementById('loadingOverlay').classList.add('hidden');
      video.play().catch(()=>{});
    });
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) showErr();
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.onloadedmetadata = () => {
      document.getElementById('loadingOverlay').classList.add('hidden');
      video.play().catch(()=>{});
    };
  } else {
    video.src = url;
    video.onloadeddata = () =>
      document.getElementById('loadingOverlay').classList.add('hidden');
    video.play().catch(showErr);
  }
  video.onerror = showErr;
}

function showErr() {
  document.getElementById('loadingOverlay').classList.add('hidden');
  document.getElementById('errorOverlay').classList.remove('hidden');
  video.style.display = 'none';
}

function retry() {
  document.getElementById('errorOverlay').classList.add('hidden');
  document.getElementById('loadingOverlay').classList.remove('hidden');
  video.style.display = 'block';
  startStream(currentUrl);
}

function closePlayer() {
  document.getElementById('playerWrap').classList.remove('show');
  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.src = '';
}

// ═══════════════════════════════════════
// PWA
// ═══════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ═══════════════════════════════════════
// START
// ═══════════════════════════════════════
render();
