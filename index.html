<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OMNI TV - Live Streaming</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0E21"/>
  
  <!-- Video Player Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/video.js@8/dist/video.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/video.js@8/dist/video-min.css" rel="stylesheet"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0A0E21;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* TOP BAR */
    .topbar {
      background: #1C1E2D;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: linear-gradient(135deg, #FF2D55, #FF6B35);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #FF2D55, #FF6B35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-badge {
      background: #FF2D55;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* SEARCH */
    .search-container {
      padding: 15px 20px;
      background: #0A0E21;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      background: #1C1E2D;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .search-input::placeholder { color: rgba(255,255,255,0.3); }

    .search-input:focus {
      border-color: #FF2D55;
    }

    /* CATEGORIES */
    .categories {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #1C1E2D;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
      transition: all 0.3s;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, #FF2D55, #FF6B35);
      border: none;
      color: white;
      font-weight: bold;
    }

    /* VIDEO PLAYER */
    .player-container {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.97);
      z-index: 1000;
      flex-direction: column;
    }

    .player-container.active {
      display: flex;
    }

    .player-topbar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      background: rgba(0,0,0,0.8);
    }

    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:hover { background: #FF2D55; }

    .player-title {
      font-size: 16px;
      font-weight: bold;
      flex: 1;
    }

    .live-dot {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,0,0,0.2);
      padding: 5px 12px;
      border-radius: 15px;
    }

    .live-dot span {
      width: 8px;
      height: 8px;
      background: red;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    .video-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    video {
      width: 100%;
      max-height: 100%;
    }

    /* CHANNEL GRID */
    .section-title {
      padding: 20px 20px 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .section-title span {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      font-weight: normal;
      margin-left: 10px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 10px 20px;
    }

    .channel-card {
      background: #1C1E2D;
      border-radius: 16px;
      padding: 20px 15px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .channel-card:hover {
      transform: translateY(-4px);
      border-color: #FF2D55;
      box-shadow: 0 10px 30px rgba(255,45,85,0.2);
    }

    .channel-card:active {
      transform: scale(0.97);
    }

    .channel-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin: 0 auto 12px;
      display: block;
      border-radius: 10px;
    }

    .channel-logo-placeholder {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #FF2D55, #FF6B35);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 12px;
    }

    .channel-name {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .channel-cat {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }

    .live-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      color: white;
      font-size: 9px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 8px;
    }

    /* FIFA BANNER */
    .fifa-banner {
      margin: 15px 20px;
      background: linear-gradient(135deg, #6C1D5F, #FF2D55, #FF6B35);
      border-radius: 20px;
      padding: 25px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .fifa-banner::before {
      content: '⚽';
      position: absolute;
      right: -20px;
      bottom: -20px;
      font-size: 120px;
      opacity: 0.15;
    }

    .fifa-live-badge {
      background: rgba(255,255,255,0.25);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .fifa-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .fifa-sub {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 16px;
    }

    .watch-btn {
      background: white;
      color: #FF2D55;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.4);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,45,85,0.3);
      border-top: 3px solid #FF2D55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ERROR */
    .stream-error {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255,255,255,0.6);
    }

    .retry-btn {
      margin-top: 15px;
      background: #FF2D55;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1C1E2D;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 15px;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
      z-index: 99;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      padding: 5px 20px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .nav-item.active {
      color: #FF2D55;
    }

    .nav-icon { font-size: 22px; }

    .main-content {
      padding-bottom: 80px;
    }

    /* Responsive */
    @media (max-width: 400px) {
      .channels-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 768px) {
      .channels-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div class="logo-text">OMNI TV</div>
  </div>
  <div class="live-badge">● LIVE</div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

  <!-- SEARCH -->
  <div class="search-container">
    <input 
      type="text" 
      class="search-input" 
      id="searchInput"
      placeholder="🔍  Search channels, sports, shows..."
    />
  </div>

  <!-- CATEGORIES -->
  <div class="categories" id="categories">
    <button class="cat-btn active" onclick="filterCategory('All')">All</button>
    <button class="cat-btn" onclick="filterCategory('Sports')">⚽ Sports</button>
    <button class="cat-btn" onclick="filterCategory('News')">📰 News</button>
    <button class="cat-btn" onclick="filterCategory('Entertainment')">🎬 Entertainment</button>
    <button class="cat-btn" onclick="filterCategory('Movies')">🎥 Movies</button>
    <button class="cat-btn" onclick="filterCategory('Music')">🎵 Music</button>
    <button class="cat-btn" onclick="filterCategory('Kids')">🧒 Kids</button>
  </div>

  <!-- FIFA BANNER -->
  <div class="fifa-banner" id="fifaBanner" onclick="openFIFA()">
    <div class="fifa-live-badge">
      <span>●</span> LIVE NOW
    </div>
    <div class="fifa-title">⚽ FIFA LIVE</div>
    <div class="fifa-sub">Watch live football matches now</div>
    <button class="watch-btn">▶ WATCH NOW</button>
  </div>

  <!-- CHANNELS -->
  <div class="section-title">
    📺 Live Channels <span id="channelCount">Loading...</span>
  </div>

  <div id="channelGrid" class="channels-grid">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading channels...</p>
    </div>
  </div>

</div>

<!-- VIDEO PLAYER -->
<div class="player-container" id="playerContainer">
  <div class="player-topbar">
    <button class="back-btn" onclick="closePlayer()">←</button>
    <div class="player-title" id="playerTitle">Channel Name</div>
    <div class="live-dot">
      <span></span>
      <small>LIVE</small>
    </div>
  </div>
  <div class="video-wrapper">
    <video id="mainVideo" controls playsinline></video>
  </div>
  <div id="streamError" class="stream-error" style="display:none">
    <div style="font-size:40px">📡</div>
    <p style="margin:10px 0">Stream unavailable right now</p>
    <p style="font-size:12px">Try another channel or check back later</p>
    <button class="retry-btn" onclick="retryStream()">🔄 Retry</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </div>
  <div class="nav-item" onclick="filterCategory('Sports')">
    <span class="nav-icon">⚽</span>
    <span>Sports</span>
  </div>
  <div class="nav-item" onclick="filterCategory('News')">
    <span class="nav-icon">📰</span>
    <span>News</span>
  </div>
  <div class="nav-item">
    <span class="nav-icon">❤️</span>
    <span>Favorites</span>
  </div>
</div>


<script>
// ============================================
// OMNI TV — MAIN APP ENGINE
// ============================================

let allChannels = [];
let currentCategory = 'All';
let currentStreamUrl = '';
let hlsInstance = null;
let videoEl = document.getElementById('mainVideo');

// ============================================
// FREE IPTV SOURCES
// ============================================
const SOURCES = [
  'https://iptv-org.github.io/iptv/categories/sports.m3u',
  'https://iptv-org.github.io/iptv/categories/news.m3u',
  'https://iptv-org.github.io/iptv/categories/entertainment.m3u',
  'https://iptv-org.github.io/iptv/categories/movies.m3u',
  'https://iptv-org.github.io/iptv/categories/music.m3u',
  'https://iptv-org.github.io/iptv/categories/kids.m3u',
];

// CORS proxy to fetch M3U files
const PROXY = 'https://api.allorigins.win/raw?url=';

// ============================================
// FETCH AND PARSE M3U
// ============================================
async function fetchM3U(url) {
  try {
    const response = await fetch(PROXY + encodeURIComponent(url));
    const text = await response.text();
    return parseM3U(text);
  } catch (e) {
    console.log('Failed to fetch:', url);
    return [];
  }
}

function parseM3U(content) {
  const channels = [];
  const lines = content.split('\n');
  let current = {};

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (line.startsWith('#EXTINF:')) {
      const nameMatch = line.match(/,(.+)$/);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      const groupMatch = line.match(/group-title="([^"]*)"/);

      current = {
        name: nameMatch ? nameMatch[1].trim() : 'Unknown',
        logo: logoMatch ? logoMatch[1] : '',
        category: groupMatch ? groupMatch[1] : 'General',
      };
    } else if (
      line.startsWith('http') && 
      current.name
    ) {
      channels.push({
        ...current,
        url: line,
      });
      current = {};
    }
  }

  return channels;
}

// ============================================
// LOAD ALL CHANNELS
// ============================================
async function loadChannels() {
  showLoading();
  
  try {
    // Load sports first (FIFA!)
    const sportsChannels = await fetchM3U(SOURCES[0]);
    
    // Show sports immediately
    allChannels = sportsChannels;
    renderChannels(allChannels);
    updateFIFABanner(sportsChannels);

    // Load rest in background
    for (let i = 1; i < SOURCES.length; i++) {
      const more = await fetchM3U(SOURCES[i]);
      allChannels = [...allChannels, ...more];
      
      if (currentCategory === 'All') {
        renderChannels(allChannels);
      }
    }

  } catch (e) {
    showError();
  }
}

// ============================================
// RENDER CHANNELS
// ============================================
function renderChannels(channels) {
  const grid = document.getElementById('channelGrid');
  const count = document.getElementById('channelCount');
  
  count.textContent = `${channels.length} channels`;

  if (channels.length === 0) {
    grid.innerHTML = `
      <div class="loading">
        <p>No channels found</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = channels.slice(0, 200).map((ch, i) => `
    <div class="channel-card" onclick="playChannel('${escapeAttr(ch.url)}', '${escapeAttr(ch.name)}')">
      <div class="live-tag">LIVE</div>
      ${ch.logo 
        ? `<img 
            class="channel-logo" 
            src="${ch.logo}" 
            alt="${escapeAttr(ch.name)}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
          />
          <div class="channel-logo-placeholder" style="display:none">📺</div>`
        : `<div class="channel-logo-placeholder">📺</div>`
      }
      <div class="channel-name">${ch.name}</div>
      <div class="channel-cat">${ch.category}</div>
    </div>
  `).join('');
}

function escapeAttr(str) {
  return String(str)
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '');
}

// ============================================
// CATEGORY FILTER
// ============================================
function filterCategory(cat) {
  currentCategory = cat;

  // Update active button
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(cat));
  });

  if (cat === 'All') {
    renderChannels(allChannels);
    return;
  }

  const filtered = allChannels.filter(ch =>
    ch.category.toLowerCase().includes(cat.toLowerCase()) ||
    ch.name.toLowerCase().includes(cat.toLowerCase())
  );

  renderChannels(filtered);
}

// ============================================
// SEARCH
// ============================================
document.getElementById('searchInput').addEventListener('input', function() {
  const query = this.value.toLowerCase().trim();

  if (!query) {
    renderChannels(allChannels);
    return;
  }

  const results = allChannels.filter(ch =>
    ch.name.toLowerCase().includes(query) ||
    ch.category.toLowerCase().includes(query)
  );

  renderChannels(results);
});

// ============================================
// FIFA BANNER
// ============================================
function updateFIFABanner(channels) {
  const sportsCount = channels.filter(ch => {
    const n = ch.name.toLowerCase();
    return n.includes('sport') || n.includes('espn') || 
           n.includes('bein') || n.includes('fox') ||
           n.includes('sky') || n.includes('star') ||
           n.includes('football') || n.includes('soccer');
  }).length;

  document.querySelector('.fifa-sub').textContent = 
    `${sportsCount} live sports channels available`;
}

function openFIFA() {
  // Filter sports and play first one
  const sports = allChannels.filter(ch => {
    const n = ch.name.toLowerCase();
    const c = ch.category.toLowerCase();
    return n.includes('sport') || c.includes('sport') ||
           n.includes('espn') || n.includes('bein') ||
           n.includes('fox') || n.includes('sky') ||
           n.includes('football') || n.includes('soccer') ||
           n.includes('star sport') || n.includes('sony');
  });

  if (sports.length > 0) {
    filterCategory('Sports');
  } else {
    alert('Loading sports channels... please wait');
  }
}

// ============================================
// PLAY CHANNEL
// ============================================
function playChannel(url, name) {
  currentStreamUrl = url;
  
  document.getElementById('playerTitle').textContent = name;
  document.getElementById('playerContainer').classList.add('active');
  document.getElementById('streamError').style.display = 'none';
  videoEl.style.display = 'block';

  // Destroy previous HLS instance
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  videoEl.src = '';

  // Try HLS first
  if (url.includes('.m3u8') || url.includes('m3u')) {
    if (Hls.isSupported()) {
      hlsInstance = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90,
      });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(videoEl);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        videoEl.play().catch(() => {});
      });
      hlsInstance.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          showStreamError();
        }
      });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari / iOS
      videoEl.src = url;
      videoEl.play().catch(() => {});
    }
  } else {
    // Direct stream (MP4, TS, etc)
    videoEl.src = url;
    videoEl.play().catch(() => showStreamError());
  }

  videoEl.onerror = () => showStreamError();
}

function showStreamError() {
  videoEl.style.display = 'none';
  document.getElementById('streamError').style.display = 'block';
}

function retryStream() {
  if (currentStreamUrl) {
    playChannel(
      currentStreamUrl, 
      document.getElementById('playerTitle').textContent
    );
  }
}

// ============================================
// CLOSE PLAYER
// ============================================
function closePlayer() {
  document.getElementById('playerContainer').classList.remove('active');
  
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  
  videoEl.pause();
  videoEl.src = '';
  document.getElementById('streamError').style.display = 'none';
  videoEl.style.display = 'block';
}

// ============================================
// UI HELPERS
// ============================================
function showLoading() {
  document.getElementById('channelGrid').innerHTML = `
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>
      <p>Loading live channels...</p>
    </div>
  `;
}

function showError() {
  document.getElementById('channelGrid').innerHTML = `
    <div class="loading" style="grid-column:1/-1">
      <p>⚠️ Failed to load channels</p>
      <button class="retry-btn" onclick="loadChannels()">Retry</button>
    </div>
  `;
}

// ============================================
// SERVICE WORKER (PWA)
// ============================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ============================================
// START APP
// ============================================
loadChannels();
</script>
</body>
</html>
